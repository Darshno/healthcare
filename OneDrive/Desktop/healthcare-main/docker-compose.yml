version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Python Analytics Service (if running locally)
  python_analytics:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: healthcare_python_analytics
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthcare
      REDIS_URL: redis://redis:6379
      NESTJS_API_URL: http://nestjs_server:3000
      CORS_ORIGIN: "*"
      JWT_SECRET: dev-secret-change-in-production
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: healthcare_network
